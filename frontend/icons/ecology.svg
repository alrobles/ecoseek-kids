<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="70%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="80%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </radialGradient>
  </defs>

  <!-- Background sky -->
  <rect width="200" height="200" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="155" cy="35" r="22" fill="url(#sunGrad)"/>
  <!-- Sun rays -->
  <g stroke="#FFD600" stroke-width="3" stroke-linecap="round">
    <line x1="155" y1="8" x2="155" y2="2"/>
    <line x1="155" y1="62" x2="155" y2="68"/>
    <line x1="128" y1="35" x2="122" y2="35"/>
    <line x1="182" y1="35" x2="188" y2="35"/>
    <line x1="136" y1="16" x2="132" y2="12"/>
    <line x1="174" y1="16" x2="178" y2="12"/>
    <line x1="136" y1="54" x2="132" y2="58"/>
    <line x1="174" y1="54" x2="178" y2="58"/>
  </g>

  <!-- Rolling hills background -->
  <ellipse cx="100" cy="195" rx="140" ry="50" fill="#43A047"/>
  <ellipse cx="40" cy="190" rx="80" ry="40" fill="#388E3C"/>
  <ellipse cx="170" cy="185" rx="70" ry="35" fill="#388E3C"/>

  <!-- Earth globe -->
  <circle cx="100" cy="110" r="42" fill="url(#globe)"/>
  <!-- Continents - simplified shapes -->
  <path d="M75 85 Q85 80 95 88 Q100 95 90 100 Q80 105 75 98 Z" fill="#4CAF50" opacity="0.7"/>
  <path d="M105 90 Q115 85 125 92 Q130 100 120 108 Q110 112 105 105 Z" fill="#4CAF50" opacity="0.7"/>
  <path d="M88 110 Q95 108 100 115 Q102 122 95 125 Q88 122 85 116 Z" fill="#4CAF50" opacity="0.6"/>
  <!-- Ocean shimmer -->
  <ellipse cx="85" cy="95" rx="15" ry="5" fill="#81C784" opacity="0.3"/>
  <ellipse cx="115" cy="115" rx="10" ry="4" fill="#81C784" opacity="0.3"/>

  <!-- Left tree -->
  <rect x="22" y="130" width="8" height="25" rx="3" fill="#795548"/>
  <circle cx="26" cy="120" r="18" fill="#2E7D32"/>
  <circle cx="18" cy="128" r="12" fill="#388E3C"/>
  <circle cx="34" cy="126" r="11" fill="#43A047"/>

  <!-- Right tree -->
  <rect x="170" y="125" width="8" height="30" rx="3" fill="#795548"/>
  <circle cx="174" cy="115" r="20" fill="#2E7D32"/>
  <circle cx="165" cy="122" r="13" fill="#388E3C"/>
  <circle cx="183" cy="120" r="12" fill="#43A047"/>

  <!-- Small leaves floating -->
  <ellipse cx="50" cy="140" rx="6" ry="3" fill="#66BB6A" transform="rotate(-20 50 140)"/>
  <ellipse cx="145" cy="135" rx="5" ry="2.5" fill="#81C784" transform="rotate(15 145 135)"/>

  <!-- Recycling arrows around globe -->
  <path d="M55 70 Q65 55 80 65" stroke="#A5D6A7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M145 70 Q135 55 120 65" stroke="#A5D6A7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 150 Q100 165 100 170" stroke="#A5D6A7" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Clouds -->
  <ellipse cx="40" cy="30" rx="18" ry="8" fill="white" opacity="0.7"/>
  <ellipse cx="50" cy="25" rx="14" ry="7" fill="white" opacity="0.7"/>
  <ellipse cx="60" cy="40" rx="16" ry="7" fill="white" opacity="0.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="40%" stop-color="#1B1464"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <radialGradient id="planet1" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </radialGradient>
    <radialGradient id="planet2" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>
    <radialGradient id="jupiter" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="200" height="200" fill="url(#spaceBg)"/>

  <!-- Nebula glow -->
  <ellipse cx="30" cy="40" rx="60" ry="40" fill="#7B1FA2" opacity="0.15"/>
  <ellipse cx="170" cy="160" rx="70" ry="45" fill="#303F9F" opacity="0.12"/>

  <!-- Stars - tiny dots scattered -->
  <g fill="white">
    <circle cx="10" cy="15" r="1.5" opacity="0.9"/>
    <circle cx="40" cy="8" r="1" opacity="0.7"/>
    <circle cx="75" cy="20" r="1.2" opacity="0.8"/>
    <circle cx="120" cy="12" r="1" opacity="0.6"/>
    <circle cx="160" cy="25" r="1.5" opacity="0.9"/>
    <circle cx="180" cy="8" r="1" opacity="0.5"/>
    <circle cx="25" cy="70" r="1" opacity="0.7"/>
    <circle cx="55" cy="55" r="0.8" opacity="0.6"/>
    <circle cx="145" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="185" cy="65" r="0.8" opacity="0.5"/>
    <circle cx="15" cy="130" r="1" opacity="0.6"/>
    <circle cx="45" cy="110" r="1.3" opacity="0.7"/>
    <circle cx="80" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="170" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="195" cy="140" r="1" opacity="0.6"/>
    <circle cx="30" cy="180" r="1" opacity="0.5"/>
    <circle cx="110" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="140" cy="85" r="0.8" opacity="0.5"/>
    <circle cx="65" cy="95" r="1" opacity="0.6"/>
  </g>

  <!-- Twinkling star bursts -->
  <g>
    <circle cx="120" cy="12" r="6" fill="url(#starGlow)" opacity="0.3"/>
    <circle cx="145" cy="50" r="5" fill="url(#starGlow)" opacity="0.25"/>
    <circle cx="25" cy="70" r="7" fill="url(#starGlow)" opacity="0.2"/>
  </g>

  <!-- Planet 1 - Large red/pink planet (top left) -->
  <circle cx="50" cy="50" r="22" fill="url(#planet1)"/>
  <!-- Ring/atmosphere -->
  <ellipse cx="50" cy="50" rx="30" ry="6" fill="none" stroke="#FFCDD2" stroke-width="1.5" opacity="0.4" transform="rotate(-20 50 50)"/>

  <!-- Planet 2 - Blue planet (bottom right) -->
  <circle cx="150" cy="140" r="18" fill="url(#planet2)"/>
  <!-- Atmosphere highlight -->
  <ellipse cx="145" cy="135" rx="8" ry="5" fill="#4FC3F7" opacity="0.3"/>

  <!-- Jupiter-like planet (top right) -->
  <circle cx="160" cy="55" r="16" fill="url(#jupiter)"/>
  <!-- Jupiter bands -->
  <ellipse cx="160" cy="48" rx="14" ry="3" fill="#BF360C" opacity="0.4"/>
  <ellipse cx="160" cy="56" rx="15" ry="3" fill="#E65100" opacity="0.3"/>
  <ellipse cx="160" cy="62" rx="13" ry="2.5" fill="#BF360C" opacity="0.35"/>
  <!-- Great red spot -->
  <ellipse cx="165" cy="57" rx="4" ry="2.5" fill="#D84315" opacity="0.6"/>

  <!-- Moon (bottom center-left) -->
  <circle cx="40" cy="155" r="12" fill="url(#moonGrad)"/>
  <!-- Moon craters -->
  <circle cx="36" cy="151" r="2" fill="#BDBDBD" opacity="0.5"/>
  <circle cx="44" cy="158" r="1.5" fill="#BDBDBD" opacity="0.4"/>
  <circle cx="38" cy="160" r="2.5" fill="#BDBDBD" opacity="0.3"/>

  <!-- Rocket ship (center) -->
  <g transform="translate(105, 95) rotate(-25)">
    <!-- Rocket body -->
    <path d="M0,-20 Q8,-20 10,-5 Q12,10 10,20 L-10,20 Q-12,10 -10,-5 Q-8,-20 0,-20 Z" fill="#E0E0E0"/>
    <path d="M0,-20 Q8,-20 10,-5 Q12,10 10,20 L0,20 Z" fill="#BDBDBD"/>
    <!-- Nose cone -->
    <path d="M-6,-18 Q0,-28 6,-18" fill="#FF5722"/>
    <!-- Window -->
    <circle cx="0" cy="-2" r="4" fill="#29B6F6"/>
    <circle cx="-1" cy="-3" r="1.5" fill="white" opacity="0.6"/>
    <!-- Fins -->
    <path d="M-8,15 L-14,20 L-10,10 Z" fill="#FF5722"/>
    <path d="M8,15 L14,20 L10,10 Z" fill="#FF5722"/>
    <!-- Flames -->
    <path d="M-6,20 Q0,32 6,20" fill="#FF9800"/>
    <path d="M-4,20 Q0,28 4,20" fill="#FFEB3B"/>
  </g>

  <!-- Asteroid belt dots -->
  <g fill="#9E9E9E" opacity="0.5">
    <ellipse cx="80" cy="100" rx="2" ry="1.5"/>
    <ellipse cx="95" cy="95" rx="1.5" ry="1"/>
    <ellipse cx="70" cy="105" rx="1" ry="1"/>
  </g>

  <!-- Tiny planet with ring (saturn-like) near bottom -->
  <circle cx="175" cy="175" r="7" fill="#FFB74D"/>
  <ellipse cx="175" cy="175" rx="11" ry="2.5" fill="none" stroke="#FFCC80" stroke-width="1.5" opacity="0.6" transform="rotate(-25 175 175)"/>
</svg>